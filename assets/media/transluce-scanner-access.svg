<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc">
  <title id="title">Indirect Network Access Through a URL Scanner</title>
  <desc id="desc">An editorial schematic shows an agent submitting a URL to a scanner, which requests a target website. A separate log panel highlights the partial evidence visible in public scanner records.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254fc4"/></marker>
  </defs>
  <rect width="1000" height="530" fill="#f5f5f4"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#232323">
    <text x="50" y="52" font-size="25" letter-spacing="2">INDIRECT NETWORK ACCESS</text>
    <text x="950" y="52" text-anchor="end" font-size="24" fill="#585b62">间接网络访问</text>
    <g fill="#ffffff" stroke="#dcdde0" stroke-width="2">
      <rect x="50" y="90" width="240" height="220" rx="8"/>
      <rect x="380" y="90" width="240" height="220" rx="8"/>
      <rect x="710" y="90" width="240" height="220" rx="8"/>
    </g>
    <g fill="none" stroke="#254fc4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="128" y="122" width="84" height="65" rx="5"/>
      <path d="M143 140l15 12-15 12M171 164h25M152 197h36"/>
      <rect x="458" y="122" width="84" height="65" rx="5"/>
      <path d="M458 139h84M471 131h2M482 131h2"/>
      <circle cx="495" cy="159" r="12"/><path d="M504 168l13 13"/>
      <rect x="788" y="122" width="84" height="65" rx="5"/>
      <path d="M804 139h51M804 152h51M804 166h51M812 197h36"/>
    </g>
    <g font-size="31" text-anchor="middle">
      <text x="170" y="245">Agent</text><text x="170" y="282" fill="#585b62">智能体</text>
      <text x="500" y="245">URL Scanner</text><text x="500" y="282" fill="#585b62">URL 扫描服务</text>
      <text x="830" y="245">Target Website</text><text x="830" y="282" fill="#585b62">目标网站</text>
    </g>
    <g stroke="#254fc4" stroke-width="4" marker-end="url(#arrow)">
      <path d="M300 186H363"/><path d="M630 186H693"/>
    </g>
    <path d="M500 322V358" stroke="#585b62" stroke-width="3" stroke-dasharray="6 6"/>
    <rect x="175" y="366" width="650" height="125" rx="8" fill="#edf1fc"/>
    <g fill="none" stroke="#254fc4" stroke-width="3" stroke-linecap="round">
      <path d="M213 391h51v73h-51zM225 409h27M225 423h27M225 437h18"/>
    </g>
    <text x="288" y="410" font-size="29">Public Scanner Logs / 公开扫描日志</text>
    <text x="288" y="454" font-size="25" fill="#585b62">Partial Visibility / 局部可见</text>
  </g>
</svg>
