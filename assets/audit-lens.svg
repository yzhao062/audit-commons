<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="title desc">
<title id="title">The audit lens</title>
<desc id="desc">State the claim, follow the evidence, and make a bounded finding.</desc>
<rect width="520" height="420" fill="#fff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#232323">
<text x="0" y="27" font-size="13" letter-spacing="2" fill="#65676c">THE AUDIT LENS</text>
<path d="M0 49H520" stroke="#232323"/>
<g font-size="14" fill="#254fc4"><text x="0" y="94">01</text><text x="0" y="204">02</text><text x="0" y="314">03</text></g>
<g font-size="25"><text x="45" y="94">State the claim.</text><text x="45" y="204">Follow the evidence.</text><text x="45" y="314">Make a bounded finding.</text></g>
<g font-size="17" fill="#585b62"><text x="45" y="128">What are we trying to check?</text><text x="45" y="238">Which records can a reviewer inspect?</text><text x="45" y="348">What follows, and what remains unknown?</text></g>
<path d="M0 161H520M0 271H520M0 381H520" stroke="#dcdde0"/>
<text x="0" y="410" font-size="12" letter-spacing="1" fill="#65676c">CLAIM / EVIDENCE / FINDING AND LIMITS</text>
</g></svg>
